<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Applies the persisted theme before first paint (same
         'spdebugger:theme' localStorage key ThemeContext.jsx uses) so
         a Day Mode user never sees a flash of the dark default while
         React boots. Kept tiny and inline -- no external script, no
         framework dependency, runs synchronously before CSS paints. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('spdebugger:theme')
          document.documentElement.setAttribute('data-theme', stored === 'light' ? 'light' : 'dark')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Stored Procedure Debugger</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
